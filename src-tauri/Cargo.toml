[package]
name = "beetbot"
version = "0.2.0"
description = "Local-first music player and personal media server"
authors = ["Beetbot"]
edition = "2021"
rust-version = "1.77"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "beetbot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# Compiles src/cast/cast_channel.proto into a Rust module the cast
# protocol layer consumes (one tiny CastMessage type with seven
# fields — small enough to hand-roll but prost is the cleaner call).
prost-build = "0.13"
# Vendored `protoc` so the build doesn't require the user to
# `brew install protobuf` first. The crate ships precompiled
# binaries for common platforms; we point prost-build at it via
# the PROTOC env var in build.rs.
protoc-bin-vendored = "3"

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
csv = "1.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip", "blocking"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
urlencoding = "2.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "process", "fs"] }
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
keyring = "3"
async-trait = "0.1"
unicode-normalization = "0.1"
souvlaki = "0.8"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "cors", "set-header"] }
uuid = { version = "1", features = ["v4"] }
local-ip-address = "0.6"
mdns-sd = "0.13"
hostname = "0.4"
rcgen = "0.13"
axum-server = { version = "0.7", features = ["tls-rustls"] }
rustls = "0.23"
rustls-pemfile = "2"
time = "0.3"
igd-next = { version = "0.16", default-features = false, features = ["aio_tokio"] }
instant-acme = "0.7"
# Cast protocol: protobuf-framed messages over a TLS-but-insecure
# stream to <chromecast-ip>:8009. Hand-rolled session/controller
# logic lives under src/cast/, prost just handles the CastMessage
# encode/decode. tokio-rustls reuses rustls 0.23 we already pull
# in for the HTTPS streaming server.
prost = "0.13"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
bytes = "1"
# Decode/re-encode Deezer editorial playlist covers to paint out the baked-in
# "DEEZER" wordmark server-side (see cover_scrub). JPEG-only keeps it light —
# every Deezer cover is a JPEG.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rodio = { version = "0.22.2", features = ["symphonia-aac", "symphonia-isomp4", "symphonia-mp3", "symphonia-flac"] }
biquad = "0.6.0"
ebur128 = "0.1.10"

[dev-dependencies]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
